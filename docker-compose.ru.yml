# Русская версия: собирает frontend из исходников этого форка вместо готового
# образа ghcr.io/reconurge/flowsint-app (он английский).
#
# Запуск:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ru.yml up -d --build
#
# API и celery остаются на готовом образе: переводится только интерфейс,
# а схемы типов и описания обогатителей локализуются на клиенте.
services:
  app:
    image: flowsint-app-ru:local
    build:
      context: ./flowsint-app
      dockerfile: Dockerfile
